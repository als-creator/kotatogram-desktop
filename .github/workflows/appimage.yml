name: Kotatogram AppImage (dev).

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'kotatogram_changes.txt'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/appimage.yml'
      - 'snap/**'
      - 'Telegram/build/**'
      - '!Telegram/build/docker/centos_env/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.bat'
      - 'Telegram/Telegram.plist'
  workflow_dispatch:

jobs:

  build:
    name: Build Kotatogram (dev) and pack AppImage
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: tdesktop:centos_env
      APPDIR: AppDir

    steps:
      - name: Clone.
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        uses: docker/setup-buildx-action@v4

      - name: Libraries cache.
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.OS }}-ktg-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-ktg-libs-

      - name: Libraries (docker environment).
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      - name: Kotatogram build (Release).
        run: |
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -e CONFIG=Release \
          $IMAGE_TAG \
          /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_BUILD_TYPE=Release \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON \
          -D TDESKTOP_API_TEST=ON \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

      - name: Check binaries.
        run: |
          for f in out/Release/Kotatogram out/Release/Updater; do
            if test -f "$f"; then
              echo "$f OK ($(stat -c %s "$f") bytes)"
              file "$f"
            else
              echo "Missing: $f"
              exit 1
            fi
          done

      - name: Build AppDir.
        run: |
          set -e
          mkdir -p \
            $APPDIR/usr/bin \
            $APPDIR/usr/share/applications \
            $APPDIR/usr/share/icons/hicolor/512x512/apps
          cp out/Release/Kotatogram $APPDIR/usr/bin/
          cp out/Release/Updater $APPDIR/usr/bin/

          cp Telegram/Resources/art/icon512@2x.png $APPDIR/usr/share/icons/hicolor/512x512/apps/io.github.kotatogram.png
          cp lib/xdg/io.github.kotatogram.desktop $APPDIR/usr/share/applications/
          sed -i 's/^TryExec=.*/TryExec=Kotatogram/; s|^Icon=.*|Icon=io.github.kotatogram|' \
            $APPDIR/usr/share/applications/io.github.kotatogram.desktop

          cp $APPDIR/usr/share/icons/hicolor/512x512/apps/io.github.kotatogram.png $APPDIR/.DirIcon

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Kotatogram (dev)' \
            'Comment=Experimental Telegram Desktop fork (dev build)' \
            'Exec=Kotatogram' \
            'Icon=io.github.kotatogram' \
            'Terminal=false' \
            'Categories=Chat;Network;InstantMessaging;' \
            'StartupWMClass=Kotatogram' \
            'Keywords=tg;chat;im;messaging;messenger;tdesktop;kotatogram;' \
            > $APPDIR/kotatogram.desktop

          printf '%s\n' \
            '#!/bin/sh' \
            'SELF=$(readlink -f "$0")' \
            'HERE=${SELF%/*}' \
            'exec "$HERE/usr/bin/Kotatogram" "$@"' \
            > $APPDIR/AppRun
          chmod +x $APPDIR/AppRun

      - name: Pack AppImage.
        run: |
          set -e
          curl -sL -o /tmp/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool-x86_64.AppImage
          ARCH=x86_64 /tmp/appimagetool-x86_64.AppImage \
            --appimage-extract-and-run \
            $APPDIR Kotatogram-Desktop-dev-x86_64.AppImage

      - uses: actions/upload-artifact@v7
        name: Upload AppImage.
        with:
          name: Kotatogram-Desktop-dev-x86_64.AppImage
          path: Kotatogram-Desktop-dev-x86_64.AppImage
          if-no-files-found: error