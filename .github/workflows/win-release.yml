name: Kotatogram Windows (dev).

# Manual only. The rolling dev release is kept up to date by the AppImage
# workflow on every push to `dev`; the Windows build is started on demand with
# "Run workflow" instead of on each push.
on:
  workflow_dispatch:

jobs:

  windows:
    name: Windows x64 (Debug)
    runs-on: windows-latest

    env:
      UPLOAD_ARTIFACT: 'true'
      PREPARE_PATH: Telegram/build/prepare/prepare.py
      TBUILD: ${{ github.workspace }}\TBuild

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %GITHUB_WORKSPACE%\TBuild\Libraries
          mklink /d %userprofile%\TBuild %GITHUB_WORKSPACE%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Pin CMake below 4.4.
        shell: bash
        run: |
          python -m pip install --user "cmake<4.4" ninja
          SCRIPTS="$(python -c "import sysconfig; print(sysconfig.get_path('scripts', scheme='nt_user'))")"
          echo "PINNED_CMAKE=$SCRIPTS" >> $GITHUB_ENV
          echo "$SCRIPTS" >> $GITHUB_PATH

      - name: Clone.
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          CMAKE_ROOT="$(cmake --system-information | sed -n 's/^CMAKE_ROOT "\([^"]*\)"$/\1/p')"
          echo "CMAKE_ROOT=$CMAKE_ROOT" >> $GITHUB_ENV
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$CMAKE_ROOT/Modules/Platform/Windows-MSVC.cmake"

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" > CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v5
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-w64-third-party-${{ env.CACHE_KEY }}

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-w64-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-w64-libs-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-w64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-w64-qt-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent qt6

      # The runner runs out of disk while compiling the client, not while linking:
      #   error C1085: Cannot write compiler generated file: ...obj:
      #           No space left on device
      # The C1060 "compiler is out of heap space" that arrives alongside it is
      # only a symptom -- Windows cannot commit pages once the volume is full.
      - name: Free up some disk space.
        shell: bash
        run: |
          TP="$(cygpath -u "$TBUILD")"
          echo "--- тома ---"
          df -h
          echo "--- ThirdParty до: $(du -sh "$TP/ThirdParty" 2>/dev/null | cut -f1) ---"

          # msys64 and jom are prepare.py tooling and nothing in the client build
          # reads them: grepping the tree for ThirdParty/msys64 and
          # ThirdParty/jom returns no hits. ThirdParty/python and
          # ThirdParty/NuGet have to stay -- CMakeLists.txt:52 points
          # Python3_EXECUTABLE at the former, cmake/nuget.cmake:11 resolves
          # nuget out of the latter. Removing the whole directory instead costs
          # five minutes of configure time to rediscover that:
          #   Could NOT find Python3 (missing: Interpreter)
          rm -rf "$TP/ThirdParty/msys64" "$TP/ThirdParty/jom"

          find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete

          echo "--- тома после ---"
          df -h
          echo "--- Libraries после: $(du -sh "$LibrariesPath" 2>/dev/null | cut -f1) ---"

      - name: Kotatogram Desktop build (Debug).
        run: |
          C:
          cd %userprofile%\TBuild\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          qt6 ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
          -D KTGDESKTOP_BUILD_NUMBER=${{ github.run_number }} ^
          -D TDESKTOP_API_ID=611335 ^
          -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c

          # Debug is the memory hungry configuration and the runner has 16 GB.
          # At unlimited --parallel MSBuild spawns one node per core and each one
          # is a separate process buffering compiler output, which runs the node
          # out of memory: the CL task dies with System.OutOfMemoryException in
          # TrackedVCToolTask.SarifToolOutputPipe, and 28 MSB4018 follow it.
          cmake --build ..\out --config Debug --parallel 2

      - name: Self-sign executables.
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $outDir = Join-Path $env:TBUILD "$env:REPO_NAME\out\Debug"
            Write-Host "Self-signing executables in $outDir"
            if (-not (Test-Path (Join-Path $outDir 'Kotatogram.exe'))) {
              Write-Warning 'Kotatogram.exe not found, skipping sign'
              exit 0
            }

            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject 'CN=Kotatogram Dev Build' `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -KeyAlgorithm RSA -KeyLength 2048 `
              -HashAlgorithm SHA256 `
              -NotAfter (Get-Date).AddYears(1)

            $thumb = $cert.Thumbprint
            $pfx = Join-Path $env:TEMP 'ktg-dev.pfx'
            $certPwd = ConvertTo-SecureString 'ktg-dev' -Force -AsPlainText
            Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$thumb" -FilePath $pfx -Password $certPwd | Out-Null

            # Braces are required: PowerShell reads $env:ProgramFiles(x86) as the variable
            # $env:ProgramFiles followed by the literal text "(x86)", which yields
            # C:\Program Files(x86)\... and "Cannot find path". It signed nothing.
            #
            # The architecture filter is required as well. The SDK ships signtool.exe
            # under bin\<version>\<arch>\, and without the filter Get-ChildItem returns
            # the arm64 copy first. That binary cannot start on an x64 runner, the run
            # fails, and the catch below turns that into a warning while the unsigned
            # exe is uploaded anyway. That is what the last green run did.
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.Directory.Name -eq 'x64' } |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $signtool) {
              Write-Warning 'signtool.exe not found, skipping sign'
              exit 0
            }
            Write-Host "Using signtool: $($signtool.FullName)"

            & $signtool.FullName sign `
              /f $pfx /p 'ktg-dev' `
              /fd SHA256 `
              /tr 'http://timestamp.digicert.com' /td SHA256 `
              /a (Join-Path $outDir 'Kotatogram.exe')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            & $signtool.FullName sign `
              /f $pfx /p 'ktg-dev' `
              /fd SHA256 `
              /tr 'http://timestamp.digicert.com' /td SHA256 `
              /a (Join-Path $outDir 'Updater.exe')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Write-Host 'Self-sign OK'
          } catch {
            Write-Warning "Signing skipped due to error: $($_.Exception.Message)"
            Write-Warning 'Kotatogram.exe and Updater.exe are being released UNSIGNED, Windows will warn on every start'
          }

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Debug
          mkdir artifact
          move %OUT%\Kotatogram.exe artifact/
          move %OUT%\Updater.exe artifact/
          copy "%TBUILD%\%REPO_NAME%\Telegram\Resources\art\icon256blue.ico" artifact\icon.ico >nul 2>&1

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: Kotatogram Windows x64 (dev)
          path: artifact\

  # Packaging and publishing run on ubuntu rather than on windows-latest: zip
  # and gh are already here, and the PowerShell equivalent buys nothing for a
  # step that only compresses two files.
  release:
    name: Publish Windows build to Releases
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: Kotatogram Windows x64 (dev)
          path: winartifact

      - name: Package and publish.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          VER=$(grep '^AppVersionStr ' Telegram/build/version | awk '{print $2}')
          # Same tag as the AppImage and macOS workflows: keyed on the commit so
          # all three land in one release despite having separate run counters.
          SHORT="${GITHUB_SHA:0:7}"
          TAG="v${VER}-dev-${SHORT}"
          TITLE="Kotatogram v${VER} (dev) - ${SHORT}"
          ASSET="Kotatogram-dev-windows-x64.zip"

          # icon.ico is stored for reference next to the artifact, it is not
          # something a user should unpack next to the executable.
          rm -f winartifact/icon.ico
          (cd winartifact && zip -q -9 "../$ASSET" Kotatogram.exe Updater.exe)

          NOTES=$(mktemp)
          {
            printf 'Dev build of [als-creator/kotatogram-desktop](%s) branch `dev`, commit `%s`, actual version `v%s` (upstream dev, based on tdesktop, with forums).\n\n' "https://github.com/$REPO" "$GITHUB_SHA" "$VER"
            printf 'This release is filled in by three workflows, so the assets appear as each platform finishes.\n\n'
            cat docs/dev-release-notes.md
          } > "$NOTES"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists, adding the Windows build to it."
            gh release upload "$TAG" "$ASSET" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$REPO" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --target "$GITHUB_SHA"
          fi