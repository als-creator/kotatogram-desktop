name: Kotatogram Windows Release (dev).

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'kotatogram_changes.txt'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win-release.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  workflow_dispatch:

jobs:

  windows:
    name: Windows x64 (Release)
    runs-on: windows-latest

    env:
      UPLOAD_ARTIFACT: 'true'
      PREPARE_PATH: Telegram/build/prepare/prepare.py
      TBUILD: ${{ github.workspace }}\TBuild

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Pin CMake below 4.4.
        shell: bash
        run: |
          python -m pip install --user "cmake<4.4" ninja
          SCRIPTS="$(python -c "import sysconfig; print(sysconfig.get_path('scripts', scheme='nt_user'))")"
          echo "PINNED_CMAKE=$SCRIPTS" >> $GITHUB_ENV
          echo "$SCRIPTS" >> $GITHUB_PATH

      - name: Clone.
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          CMAKE_ROOT="$(cmake --system-information | sed -n 's/^CMAKE_ROOT "\([^"]*\)"$/\1/p')"
          echo "CMAKE_ROOT=$CMAKE_ROOT" >> $GITHUB_ENV
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$CMAKE_ROOT/Modules/Platform/Windows-MSVC.cmake"

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" > CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v5
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-w64-third-party-${{ env.CACHE_KEY }}

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-w64-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-w64-libs-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-w64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-w64-qt-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent qt6

      - name: Kotatogram Desktop build (Release).
        run: |
          C:
          cd %userprofile%\TBuild\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          qt6 ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF ^
          -D TDESKTOP_API_ID=611335 ^
          -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c

          cmake --build ..\out --config Release --parallel

      - name: Self-sign executables.
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $outDir = Join-Path $env:TBUILD "$env:REPO_NAME\out\Release"
            Write-Host "Self-signing executables in $outDir"
            if (-not (Test-Path (Join-Path $outDir 'Kotatogram.exe'))) {
              Write-Warning 'Kotatogram.exe not found, skipping sign'
              exit 0
            }

            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject 'CN=Kotatogram Dev Build' `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -KeyAlgorithm RSA -KeyLength 2048 `
              -HashAlgorithm SHA256 `
              -NotAfter (Get-Date).AddYears(1)

            $thumb = $cert.Thumbprint
            $pfx = Join-Path $env:TEMP 'ktg-dev.pfx'
            $certPwd = ConvertTo-SecureString 'ktg-dev' -Force -AsPlainText
            Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$thumb" -FilePath $pfx -Password $certPwd | Out-Null

            $signtool = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $signtool) {
              Write-Warning 'signtool.exe not found, skipping sign'
              exit 0
            }
            Write-Host "Using signtool: $($signtool.FullName)"

            & $signtool.FullName sign `
              /f $pfx /p 'ktg-dev' `
              /fd SHA256 `
              /tr 'http://timestamp.digicert.com' /td SHA256 `
              /a (Join-Path $outDir 'Kotatogram.exe')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            & $signtool.FullName sign `
              /f $pfx /p 'ktg-dev' `
              /fd SHA256 `
              /tr 'http://timestamp.digicert.com' /td SHA256 `
              /a (Join-Path $outDir 'Updater.exe')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Write-Host 'Self-sign OK'
          } catch {
            Write-Warning "Signing skipped due to error: $($_.Exception.Message)"
          }

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir artifact
          move %OUT%\Kotatogram.exe artifact/
          move %OUT%\Updater.exe artifact/
          copy "%TBUILD%\%REPO_NAME%\Telegram\Resources\art\icon256blue.ico" artifact\icon.ico >nul 2>&1

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: Kotatogram Windows x64 (dev)
          path: artifact\