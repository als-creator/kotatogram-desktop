name: MacOS.

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'kotatogram_changes.txt'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/mac.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.bat'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'kotatogram_changes.txt'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/mac.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.bat'
  workflow_dispatch:

jobs:

  macos:
    name: MacOS
    if: >
      !(github.event_name == 'push'
        && contains(github.event.head_commit.message, '[skip ci]'))
      && !(github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) 
    runs-on: macos-latest

    strategy:
      matrix:
        defines:
          - ""
    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      API_ID: ${{ secrets.TDESKTOP_API_ID }}
      API_HASH: ${{ secrets.TDESKTOP_API_HASH }}

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share

          brew update
          brew upgrade || true
          brew install automake libtool meson nasm ninja pkg-config

          # Disable spotlight.
          sudo mdutil -a -i off

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Pin CMake below 4.4.
        run: |
          # Homebrew now ships CMake 4.4, which added policy CMP0218. Under it
          # CMAKE_ERROR_DEPRECATED and CMAKE_WARN_DEPRECATED are ignored, and
          # cmake/external/cmark_gfm/CMakeLists.txt still reads both to carry them
          # around, so configure dies with
          #   CMake Error (policy) at cmake/external/cmark_gfm/CMakeLists.txt:60
          # Same pin win-release.yml already uses.
          python -m pip install --user "cmake<4.4"
          SCRIPTS="$(python -c "import sysconfig; print(sysconfig.get_path('scripts', scheme='posix_user'))")"
          echo "$SCRIPTS" >> $GITHUB_PATH

          # Debug builds of tdesktop do not fit on a runner with debug info.
          # Resolve the file through the cmake that is first on PATH, which is
          # the pinned one, rather than through the Homebrew path it replaces.
          export PATH="$SCRIPTS:$PATH"
          CMAKE_ROOT="$(cmake --system-information | sed -n 's/^CMAKE_ROOT "\([^"]*\)"$/\1/p')"
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' "$CMAKE_ROOT/Modules/Compiler/GNU.cmake"

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v5
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Libraries.
        run: |
          ./$REPO_NAME/Telegram/build/prepare/mac.sh skip-release silent

      - name: Free up some disk space.
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      - name: Kotatogram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd $REPO_NAME/Telegram

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=Kotatogram ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=Kotatogram" >> $GITHUB_ENV
          fi

          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            API_ARGS="-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH"
          else
            echo "::warning::TDESKTOP_API_ID/HASH secrets are not set; building with the TEST API (works only with Telegram test servers)."
            API_ARGS="-D TDESKTOP_API_TEST=ON"
          fi

          ./configure.sh \
          -D CMAKE_CONFIGURATION_TYPES=Debug \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON \
          -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          $API_ARGS \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
          $DEFINE

          cmake --build ../out --config Debug --parallel

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          cd $REPO_NAME/out/Debug
          mkdir artifact
          mv Kotatogram.app artifact/
          mv Updater artifact/
      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPO_NAME }}/out/Debug/artifact/

      # ditto is the packager macOS itself expects for an app bundle: it keeps
      # the executable bit, the symlinks and the resource forks, none of which a
      # zip written by another platform is guaranteed to preserve. That is why
      # this runs here and not in the publishing job below.
      - name: Package for release.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          set -euo pipefail
          cd "$REPO_NAME/out/Debug"
          ARCH=$(uname -m)
          ASSET="Kotatogram-dev-macos-${ARCH}.zip"
          mkdir -p pkg/Kotatogram-macos-${ARCH}
          mv artifact/Kotatogram.app artifact/Updater pkg/Kotatogram-macos-${ARCH}/
          cd pkg
          ditto -c -k --sequesterRsrc --keepParent \
            "Kotatogram-macos-${ARCH}" \
            "$GITHUB_WORKSPACE/$ASSET"
          echo "Packaged $ASSET"
          ls -l "$GITHUB_WORKSPACE/$ASSET"

      - uses: actions/upload-artifact@v7
        name: Upload release package.
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: Kotatogram macOS release
          path: Kotatogram-dev-macos-*.zip

  release:
    name: Publish macOS build to Releases
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: Kotatogram macOS release
          path: macrelease

      - name: Publish.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          VER=$(grep '^AppVersionStr ' Telegram/build/version | awk '{print $2}')
          # Same tag as the AppImage and Windows workflows: keyed on the commit
          # so all three land in one release despite separate run counters.
          SHORT="${GITHUB_SHA:0:7}"
          TAG="v${VER}-dev-${SHORT}"
          TITLE="Kotatogram v${VER} (dev) - ${SHORT}"
          ASSET=$(ls macrelease/Kotatogram-dev-macos-*.zip)

          NOTES=$(mktemp)
          {
            printf 'Dev build of [als-creator/kotatogram-desktop](%s) branch `dev`, commit `%s`, actual version `v%s` (upstream dev, based on tdesktop, with forums).\n\n' "https://github.com/$REPO" "$GITHUB_SHA" "$VER"
            printf 'This release is filled in by three workflows, so the assets appear as each platform finishes.\n\n'
            cat docs/dev-release-notes.md
          } > "$NOTES"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists, adding the macOS build to it."
            gh release upload "$TAG" "$ASSET" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$REPO" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --target "$GITHUB_SHA"
          fi
